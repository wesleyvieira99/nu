name: Python case labs

on:
  push:
    paths:
      - 'labs/**/*.py'
      - '.github/workflows/labs.yml'
  pull_request:
    paths:
      - 'labs/**/*.py'
      - '.github/workflows/labs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-labs:
    name: Evidence case tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Run the 241 Python case tests
        run: python -m unittest discover -s labs -p 'case_*.py' -v
